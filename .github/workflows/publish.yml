name: Publish edition

# Runs when the newsroom pushes new articles (or by hand):
# AI banners -> build site, social cards and reel -> deploy to news.metaflora.xyz -> post top stories to X.
# Also runs every weekday after the US close to refresh the cannabis stock pages (no X posts on that run).
on:
  push:
    branches: [main]
    paths: ["content/**", "newsroom/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      new_articles: ${{ steps.new.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so multi-commit pushes diff against the real previous head
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Ubuntu package mirror stalled repeatedly on 6 Nov 2026 and blocked deploys. The .deb files are
      # cached with GitHub's own cache (keyed to the runner image), so normal runs never touch the mirror.
      - name: Tool cache key
        id: debkey
        run: echo "key=tool-debs-v1-${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore cached tool packages
        id: debcache
        uses: actions/cache/restore@v4
        with:
          path: ~/tool-debs
          key: ${{ steps.debkey.outputs.key }}
      - name: Install tools
        id: tools
        timeout-minutes: 14
        run: |
          need() { command -v rsvg-convert >/dev/null && command -v ffmpeg >/dev/null && fc-list | grep -qi "inter"; }
          PKGS="librsvg2-bin ffmpeg fonts-inter fontconfig"
          sudo rm -f /var/lib/man-db/auto-update
          if need; then
            echo "tools already present"
          elif ls ~/tool-debs/*.deb >/dev/null 2>&1 && timeout 180 sudo dpkg -i --force-confdef ~/tool-debs/*.deb >/dev/null && need; then
            echo "installed $(ls ~/tool-debs/*.deb | wc -l) packages from the cache, no mirror needed"
          else
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60 -o APT::Keep-Downloaded-Packages=true"
            for i in 1 2 3; do
              if [ "$i" -ge 2 ]; then  # second try: the main Ubuntu archive instead of the Azure mirror
                sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
              fi
              if timeout 180 sudo apt-get update -q $APT && \
                 timeout 300 sudo apt-get install -y -q -f --no-install-recommends $APT $PKGS; then
                break
              fi
              echo "apt attempt $i failed or timed out"
              [ "$i" = 3 ] && exit 1
              sleep 10
            done
            mkdir -p ~/tool-debs && cp /var/cache/apt/archives/*.deb ~/tool-debs/ 2>/dev/null || true
            n=$(ls ~/tool-debs/*.deb 2>/dev/null | wc -l)
            echo "cached $n packages for the next run"
            [ "$n" -gt 0 ] && echo "fresh=1" >> "$GITHUB_OUTPUT"
          fi
          need
          pip install -q pillow requests-oauthlib
      - name: Save tool packages for next time
        if: steps.debcache.outputs.cache-hit != 'true' && steps.tools.outputs.fresh == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/tool-debs
          key: ${{ steps.debkey.outputs.key }}
      - name: Find new articles
        id: new
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            files=""
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files=$(ls content/articles/*.json | tail -n 9 | tr '\n' ' ')
          elif [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            files=""  # unknown previous head: never re-post old stories
          else
            files=$(git diff --name-only --diff-filter=A "$before" "${{ github.sha }}" -- content/articles | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Generate AI banners
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY }}
        run: python3 newsroom/gen_images.py
      - name: Keep generated banners in the repo
        run: |
          git config user.name "MetaFlora Newsroom"
          git config user.email "newsroom@metaflora.xyz"
          git add content/images
          if ! git diff --cached --quiet; then
            git commit -m "Add AI banners [skip ci]"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
      # Lead images (card.write_leads) are redrawn only when a story's visual changes: keep docs/img between runs.
      - name: Restore rendered lead images
        uses: actions/cache/restore@v4
        with:
          path: docs/img
          key: lead-images-v1-${{ github.run_id }}
          restore-keys: lead-images-v1-
      - name: Build site
        run: python3 newsroom/build.py
      - name: Save rendered lead images
        uses: actions/cache/save@v4
        with:
          path: docs/img
          key: lead-images-v1-${{ github.run_id }}
      - name: Keep the market data cache in the repo
        run: |
          git add content/market.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market data [skip ci]"
            git pull --rebase -q origin main && git push -q origin HEAD:main || echo "market cache push skipped"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # indexnow_changed.py diffs the push against the previous head
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ping IndexNow with changed URLs
        run: python3 newsroom/indexnow.py ${{ needs.build.outputs.new_articles }}
      # Hub/aggregate pages whose content changed in this push (edited hub JSON, edited stories, the tag hubs,
      # topic and date pages a new story feeds), capped at 200 URLs. Exits 0 on any error; never blocks a publish.
      - name: Ping IndexNow with changed hub and aggregate pages
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 newsroom/indexnow_changed.py --before "${{ github.event.before }}" --after "${{ github.sha }}" --max 200

  push-alerts:
    # Web push alerts for new stories (newsroom/push.py). Dry run unless the repo variable PUSH_LIVE is 1.
    # Skips itself when Firebase isn't configured; never fails the publish.
    needs: [build, deploy]
    if: needs.build.outputs.new_articles != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "firebase-admin>=6.5,<8"
      - name: Send alerts for new stories
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_LIVE: ${{ vars.PUSH_LIVE }}
        run: python3 newsroom/push.py articles ${{ needs.build.outputs.new_articles }}
      - name: Tell admins the X posts are ready
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 newsroom/push.py xready ${{ needs.build.outputs.new_articles }}

  post-to-x:
    needs: [build, deploy]
    if: needs.build.outputs.new_articles != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests-oauthlib
      - name: Post top stories to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_POSTS_PER_EDITION: ${{ vars.X_POSTS_PER_EDITION }}
        run: python3 newsroom/post_to_x.py ${{ needs.build.outputs.new_articles }}
