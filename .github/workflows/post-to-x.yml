name: Post edition to X

on:
  push:
    branches: [main]
    paths: ["content/articles/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests-oauthlib
      - name: Find new articles
        id: new
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            files=$(ls content/articles/*.json | tail -n 9 | tr '\n' ' ')
          else
            files=$(git diff --name-only --diff-filter=A "$before" "${{ github.sha }}" -- content/articles | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Post to X
        if: steps.new.outputs.files != ''
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_POSTS_PER_EDITION: ${{ vars.X_POSTS_PER_EDITION }}
        run: python3 newsroom/post_to_x.py ${{ steps.new.outputs.files }}
