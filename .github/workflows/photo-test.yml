name: Photo test (design board)

# Renders candidate photo prompts on Cloudflare Workers AI and uploads them as a run artifact.
# Never touches content/ or the site. Prompts come from tools/photo_tests/prompts.json:
#   {"style": "...", "items": [{"name": "dea-A", "prompt": "..."}, ...]}
on:
  workflow_dispatch:
    inputs:
      wait_for_reset:
        description: "Wait until just after 00:00 UTC (Cloudflare's free daily allowance resets) before rendering"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the free allowance to reset
        if: ${{ inputs.wait_for_reset }}
        run: |
          now=$(date -u +%s); target=$(date -u -d 'tomorrow 00:05' +%s)
          wait=$(( target - now )); echo "waiting ${wait}s until $(date -u -d @$target)"
          if [ $wait -gt 0 ] && [ $wait -lt 17000 ]; then sleep $wait; fi
      - name: Render prompts
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_IMAGE_MODEL: ${{ vars.CF_IMAGE_MODEL }}
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/photo_tests/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: photo-test
          path: tools/photo_tests/out/
          retention-days: 7
